add_newline = true
palette = "catppuccin_latte"

format = """
$hostname$directory$git_branch $fill [](overlay0)$battery$memory_usage$time$cmd_duration
$character"""

right_format = """
$python
"""

[character]
success_symbol = "[󰁃 ](mauve)"
error_symbol = "[󰁜 ](red)"

[hostname]
ssh_only = true
ssh_symbol = ""
format = "[ $ssh_symbol $hostname ](mauve)[](overlay0)"

[git_branch]
symbol = "󰘬"
truncation_length = 4
truncation_symbol = ""
format = "[ $symbol $branch(:$remote_branch) ](mauve)[](overlay0)"

[directory]
home_symbol = ""
read_only = ""
truncation_length = 6
truncation_symbol = "../"
format = "[ $path ](mauve)[](overlay0)"

[directory.substitutions]
"Desktop" = ""
"Documents" = ""
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Videos" = ""

[cmd_duration]
min_time = 0
format = "[](overlay0)[  $duration ](mauve)"

[fill]
symbol = " "
style = "none"

[python]
format = "[ $virtualenv ${version} ](mauve)"

[battery]
format = "[ $symbol $percentage ](green)[](overlay0)"

[[battery.display]]
threshold = 20
style = "none"

[memory_usage]
disabled = false
threshold = -1
format = "[ 󰍛 $ram  $swap ](mauve)[](overlay0)"

[time]
disabled = false
time_format = "%T"
format = "[  $time ](mauve)"

# Catppuccin Starship port: themes/latte.toml
